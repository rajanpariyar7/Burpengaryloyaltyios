workflows:
  ios-workflow:
    name: Burpengary Market Loyalty App

    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: BurpengaryAppStore

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.burpengaryfruitmarket.loyalty

      vars:
        XCODE_PROJECT: "BurpengaryLoyalty.xcodeproj"
        XCODE_SCHEME: "BurpengaryLoyalty"

      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project from project.yml
        script: |
          xcodegen generate

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Verify generated project
        script: |
          echo "===== PROJECT ====="
          ls -la "$XCODE_PROJECT"

          echo "===== SCHEME ====="
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -list

          echo "===== FIREBASE REFERENCES ====="
          grep -n "FirebaseCore" "$XCODE_PROJECT/project.pbxproj" || true
          grep -n "FirebaseAuth" "$XCODE_PROJECT/project.pbxproj" || true
          grep -n "FirebaseFirestore" "$XCODE_PROJECT/project.pbxproj" || true

          echo "===== ASSETS ====="
          find . -name "Assets.xcassets" -print

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
