workflows:
  ios-native-workflow:
    name: Burpengary Market Loyalty App
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: BurpengaryAppStore

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.burpengaryfruitmarket.loyalty

      vars:
        XCODE_PROJECT: "BurpengaryLoyalty.xcodeproj"
        XCODE_SCHEME: "BurpengaryLoyalty"
        APP_STORE_APPLE_ID: 6810118060

      xcode: latest

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true

    scripts:

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project from project.yml
        script: |
          set -e

          xcodegen generate

          echo "--- Checking for Assets.xcassets in generated project ---"

          if grep -q "Assets.xcassets" BurpengaryLoyalty.xcodeproj/project.pbxproj; then
            echo "XcodeGen included Assets.xcassets"
          else
            echo "XcodeGen did not include Assets.xcassets"
          fi

      - name: Force-add Assets.xcassets to target
        script: |
          set -e

          echo "--- Force-adding Assets.xcassets with xcodeproj ---"

          ruby <<'RUBY'
          require "xcodeproj"

          project_path = "BurpengaryLoyalty.xcodeproj"
          asset_path = "Resources/Assets.xcassets"

          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find do |t|
            t.name == "BurpengaryLoyalty"
          end

          abort "ERROR: BurpengaryLoyalty target not found" unless target

          puts "Target found: #{target.name}"

          resources_group =
            project.main_group.find_subpath("Resources", true)

          abort "ERROR: Resources group not found" unless resources_group

          file_ref = project.files.find do |file|
            file.path == asset_path
          end

          if file_ref
            puts "Assets.xcassets reference already exists."
          else
            puts "Creating Assets.xcassets reference..."

            file_ref = resources_group.new_file(asset_path)
          end

          already_added = target.resources_build_phase.files.any? do |build_file|
            build_file.file_ref == file_ref
          end

          unless already_added
            puts "Adding Assets.xcassets to Resources build phase..."

            target.resources_build_phase.add_file_reference(file_ref)
          else
            puts "Assets.xcassets already exists in Resources build phase."
          end

          target.build_configurations.each do |config|
            config.build_settings["ASSETCATALOG_COMPILER_APPICON_NAME"] = "AppIcon"
          end

          project.save

          puts "Project saved successfully."
          RUBY

          echo "--- Verifying Assets.xcassets ---"

          if grep -q "Assets.xcassets" BurpengaryLoyalty.xcodeproj/project.pbxproj; then
            echo "SUCCESS: Assets.xcassets found in project.pbxproj"
          else
            echo "ERROR: Assets.xcassets STILL NOT FOUND"
            exit 1
          fi

          echo "--- Verifying AppIcon ---"

          if grep -q "ASSETCATALOG_COMPILER_APPICON_NAME" BurpengaryLoyalty.xcodeproj/project.pbxproj; then
            echo "SUCCESS: AppIcon configuration found"
          else
            echo "ERROR: AppIcon configuration not found"
            exit 1
          fi

      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Resolve Swift Package dependencies
        script: |
          set -e

          xcodebuild \
            -resolvePackageDependencies \
            -project "$XCODE_PROJECT"

      - name: Increment build number
        script: |
          set -e

          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build ipa for distribution
        script: |
          set -e

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
