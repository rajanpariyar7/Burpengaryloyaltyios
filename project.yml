name: BurpengaryLoyalty

options:
  bundleIdPrefix: com.burpengaryfruitmarket.loyalty
  deploymentTarget:
    iOS: "16.0"

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 10.29.0

targets:
  BurpengaryLoyalty:
    type: application
    platform: iOS

    sources:
      - Sources

    resources:
      - Resources

    info:
      path: Sources/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burpengaryfruitmarket.loyalty
        DEVELOPMENT_TEAM: "A9YM3Z9BTP"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: NO

    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
