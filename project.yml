name: BurpengaryLoyalty

options:
  bundleIdPrefix: com.burpengaryfruitmarket
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.25.0

  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  BurpengaryLoyalty:
    type: application
    platform: iOS

    sources:
      - path: Sources

    resources:
      - path: Resources/Assets.xcassets

    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Burpengary Fruit Market
        UILaunchScreen: {}

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.222042395227-8rgoppfi1nod55sskq1rd8i0rqajctlm

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.burpengaryfruitmarket.loyalty
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "A9YM3Z9BTP"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    dependencies:
      - package: Firebase
        product: FirebaseAuth

      - package: Firebase
        product: FirebaseFirestore

      - package: Firebase
        product: FirebaseMessaging

      - package: GoogleSignIn
        product: GoogleSignIn
